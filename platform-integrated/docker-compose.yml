name: platform-integrated

services:
  mysql:
    image: mysql:8.4
    container_name: platform-integrated-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${PLATFORM_DB_PASSWORD:-root123456}
      MYSQL_DATABASE: ${PLATFORM_DB_NAME:-platform_db}
    ports:
      - "${INTEGRATED_MYSQL_PORT:-13307}:3306"
    volumes:
      - integrated-mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - integrated-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: platform-integrated:local
    container_name: platform-integrated-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${PLATFORM_DB_NAME:-platform_db}
      DB_USER: root
      DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-root123456}
      SPRING_PROFILES_ACTIVE: integrated
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${INTEGRATED_APP_PORT:-3200}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - integrated-network

volumes:
  integrated-mysql-data:

networks:
  integrated-network:
    driver: bridge
